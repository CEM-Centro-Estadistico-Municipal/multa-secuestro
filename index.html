<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multas y Secuestros · CEM Esquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ── CEM Design System ─────────────────────────────────────── */
:root {
  --azul-800: #0a3a68;
  --azul-700: #0e5a9e;
  --azul-500: #378add;
  --azul-100: #d0e4f5;
  --azul-50:  #e8f0f8;
  --ocre-500: #b8863d;
  --ocre-100: #f0dfc0;
  --papel:    #f8f5ee;
  --papel2:   #eee6d5;
  --tinta:    #171614;
  --neutro:   #6b6760;
  --borde:    #ddd8cc;
  --verde:    #2f7d32;
  --rojo:     #a8322c;
  --amarillo: #c9971a;
  --sans:     'IBM Plex Sans', system-ui, sans-serif;
  --mono:     'IBM Plex Mono', monospace;
  --r:        8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--papel);
  color: var(--tinta);
  font-size: 15px;
  line-height: 1.5;
}

/* ── Header ── */
.hdr {
  background: var(--azul-800);
  padding: 1.5rem 2rem 1.25rem;
  position: relative;
  overflow: hidden;
}
.hdr::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    135deg, transparent, transparent 22px,
    rgba(184,134,61,.07) 22px, rgba(184,134,61,.07) 23px
  );
  pointer-events: none;
}
.hdr-inner { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.hdr-left {}
.hdr-badge {
  display: inline-block;
  background: var(--ocre-500);
  color: #fff;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 4px;
  margin-bottom: 10px;
}
.hdr-title { font-size: 22px; font-weight: 500; color: #fff; line-height: 1.2; }
.hdr-sub { font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.55); margin-top: 5px; }
.hdr-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(255,255,255,.6);
  margin-top: 1rem;
  flex-wrap: wrap;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf50; flex-shrink: 0; }
.status-dot.err { background: #ef5350; }
.status-dot.loading { background: var(--ocre-500); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Filtros ── */
.filtros {
  background: #fff;
  border-bottom: 1px solid var(--borde);
  padding: .75rem 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.fil-lbl { font-family: var(--mono); font-size: 11px; color: var(--neutro); text-transform: uppercase; letter-spacing: .06em; }
.fil-select {
  font-family: var(--mono);
  font-size: 12px;
  padding: 5px 10px;
  border: 1px solid var(--borde);
  border-radius: 4px;
  background: var(--papel);
  color: var(--tinta);
  cursor: pointer;
  outline: none;
}
.fil-select:focus { border-color: var(--azul-700); }
.fil-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--azul-700);
  background: var(--azul-700);
  color: #fff;
  transition: background .15s;
}
.fil-btn:hover { background: var(--azul-800); }
.fil-btn.sec {
  background: transparent;
  color: var(--azul-700);
}
.fil-btn.sec:hover { background: var(--azul-50); }
.fil-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--neutro);
}

/* ── Layout ── */
.contenido { max-width: 1280px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
.seccion { margin-bottom: 2rem; }
.sec-titulo {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--neutro);
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: .875rem;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--borde);
}

/* ── Métricas ── */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.metric-card {
  background: #fff;
  border: 1px solid var(--borde);
  border-radius: var(--r);
  padding: .875rem 1rem;
  border-left-width: 3px;
}
.metric-card.azul  { border-left-color: var(--azul-700); }
.metric-card.rojo  { border-left-color: var(--rojo); }
.metric-card.ocre  { border-left-color: var(--ocre-500); }
.metric-card.verde { border-left-color: var(--verde); }
.metric-card.amar  { border-left-color: var(--amarillo); }
.m-lbl { font-family: var(--mono); font-size: 10px; color: var(--neutro); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.m-val { font-family: var(--mono); font-size: 28px; font-weight: 500; line-height: 1; color: var(--tinta); }
.m-sub { font-size: 11px; color: var(--neutro); margin-top: 4px; }

/* ── Grilla gráficos ── */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(max-width:720px){ .chart-grid { grid-template-columns: 1fr; } }
.chart-card {
  background: #fff;
  border: 1px solid var(--borde);
  border-radius: var(--r);
  padding: 1rem 1.125rem;
}
.chart-card.full { grid-column: 1 / -1; }
.chart-titulo { font-size: 13px; font-weight: 500; color: var(--tinta); margin-bottom: .875rem; }

/* ── Barras horizontales ── */
.bars { }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar-lbl {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--tinta);
  min-width: 110px;
  max-width: 110px;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-track { flex: 1; height: 13px; background: var(--papel2); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar-num { font-family: var(--mono); font-size: 11px; color: var(--neutro); min-width: 24px; }

/* ── Heatmap ── */
.heatmap-wrap { overflow-x: auto; }
.heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.hm-cell {
  height: 36px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  transition: opacity .15s;
  cursor: default;
}
.hm-cell:hover { outline: 2px solid var(--azul-500); }
.hm-hours { display: grid; grid-template-columns: repeat(24,1fr); gap: 3px; margin-top: 3px; }
.hm-hr { font-family: var(--mono); font-size: 9px; color: var(--neutro); text-align: center; }
.hm-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-end;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--neutro);
}
.hm-grad {
  width: 80px; height: 10px;
  background: linear-gradient(to right, #e8f0f8, #0a3a68);
  border-radius: 2px;
}

/* ── Tabla ── */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--neutro);
  text-transform: uppercase;
  letter-spacing: .07em;
  padding: 7px 10px;
  border-bottom: 1px solid var(--borde);
  background: var(--papel);
  white-space: nowrap;
  text-align: left;
}
tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--borde);
  color: var(--tinta);
  vertical-align: top;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--azul-50); }
.badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 4px;
}
.badge-multa { background: var(--azul-50); color: var(--azul-700); }
.badge-sec   { background: #fae9e8;         color: var(--rojo); }

/* ── Leyenda ── */
.leyenda { display: flex; gap: 16px; flex-wrap: wrap; margin-top: .5rem; }
.ley-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--neutro); }
.ley-sw { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

/* ── Estado carga ── */
.loading-state {
  text-align: center;
  padding: 4rem 2rem;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--neutro);
}
.error-state {
  background: #fae9e8;
  border: 1px solid #f0b8b5;
  border-radius: var(--r);
  padding: 1rem 1.25rem;
  font-size: 13px;
  color: var(--rojo);
  margin: 1rem 2rem;
}
.error-state code { font-family: var(--mono); font-size: 12px; }

/* ── Footer ── */
footer {
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--neutro);
  padding: 1.5rem 2rem;
  border-top: 1px solid var(--borde);
  margin-top: 1rem;
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="hdr-badge">CEM · Secretaría de Tránsito</div>
      <h1 class="hdr-title">Multas y secuestros vehiculares</h1>
      <div class="hdr-sub">Municipio de Esquina · Corrientes · Argentina</div>
    </div>
  </div>
  <div class="hdr-status">
    <span class="status-dot loading" id="status-dot"></span>
    <span id="status-txt">Cargando datos desde Google Sheets…</span>
  </div>
</header>

<!-- FILTROS -->
<div class="filtros">
  <span class="fil-lbl">Inspector</span>
  <select class="fil-select" id="fil-inspector"><option value="">Todos</option></select>
  <span class="fil-lbl">Tipo</span>
  <select class="fil-select" id="fil-tipo">
    <option value="">Todos</option>
    <option value="MULTA">Multas</option>
    <option value="SECUESTRO">Secuestros</option>
  </select>
  <span class="fil-lbl">Mes</span>
  <select class="fil-select" id="fil-mes"><option value="">Todos</option></select>
  <button class="fil-btn" onclick="aplicarFiltros()">Aplicar filtros</button>
  <button class="fil-btn sec" onclick="resetFiltros()">Limpiar</button>
  <span class="fil-count" id="fil-count"></span>
</div>

<!-- CONTENIDO PRINCIPAL -->
<main class="contenido" id="contenido">
  <div class="loading-state" id="loading">Cargando registros…</div>
</main>

<footer>
  Centro Estadístico Municipal (CEM) · Gobierno de Esquina ·
  Datos actualizados automáticamente desde Google Sheets ·
  <span id="footer-ts"></span>
</footer>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIGURACIÓN — reemplazá CSV_URL con la URL que te da
// Archivo → Publicar en la web → CSV de la hoja de datos
// ─────────────────────────────────────────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUhCfPdUjZYtY8SKZOJpDPq4ZTIAdDSVhnH0xacjPdQazcdeg4-NvJou_ttAcT6xZZdt83hV0F9_pq/pub?output=csv';

// ─── Parseo CSV ───────────────────────────────────────────────
function parseCSV(texto) {
  const lineas = texto.trim().split('\n');
  if (lineas.length < 2) return [];
  const headers = parseCsvRow(lineas[0]).map(h => h.trim());
  return lineas.slice(1).map(l => {
    const vals = parseCsvRow(l);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });
    return obj;
  }).filter(r => r['N'] || r['Tipo Acta']);
}

function parseCsvRow(linea) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < linea.length; i++) {
    if (linea[i] === '"') {
      if (inQuotes && linea[i+1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (linea[i] === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += linea[i];
    }
  }
  result.push(current);
  return result;
}

// ─── Normalización ────────────────────────────────────────────
function normInspector(s) {
  if (!s) return 'Sin dato';
  s = s.trim();
  const m = {
    'MACHUCA LAURA/DIRECTOR':'Machuca Laura','machuca maria laura':'Machuca Laura',
    'Machuca Maria Laura':'Machuca Laura','Machuca Maria Laura/ Reboledo':'Machuca Laura',
    'Machuca Laura':'Machuca Laura',
    'Ferz. Marcelo':'Fernandez Marcelo','Fernandez Marcelo':'Fernandez Marcelo',
    'fernandez marcelo':'Fernandez Marcelo',
    'martinez, victor':'Martinez Victor','Victor Martinez':'Martinez Victor',
    'Martinez Victor':'Martinez Victor',
    'oviedo juan':'Oviedo Juan','Oviedo Juan':'Oviedo Juan',
    'veron oscar':'Veron Oscar','veron jorge':'Veron Jorge','Veron Jorge':'Veron Jorge',
    'reboledo pedro':'Reboledo Pedro','Reboledo Pedro':'Reboledo Pedro',
    'niz maximiliano /director':'Niz Maximiliano','Niz Maximiliano':'Niz Maximiliano',
    'niz anibal':'Niz Anibal','Niz Anibal':'Niz Anibal',
    'cardozo fabricio':'Cardozo Fabricio',
  };
  return m[s] || s;
}

function normMarca(s) {
  if (!s) return 'Sin dato';
  const l = s.toLowerCase();
  if (l.includes('honda')) return 'Honda';
  if (l.includes('guerrero')) return 'Guerrero';
  if (l.includes('keller')) return 'Keller';
  if (l.includes('corven')) return 'Corven';
  if (l.includes('gilera') || l.includes('gillera')) return 'Gilera';
  if (l.includes('zanella')) return 'Zanella';
  if (l.includes('motomel')) return 'Motomel';
  if (l.includes('toyota')) return 'Toyota';
  if (l.includes('ford')) return 'Ford';
  if (l.includes('brava')) return 'Brava';
  if (l.includes('mondial')) return 'Mondial';
  if (l.includes('ghiggeri') || l.includes('ghigger')) return 'Ghiggeri';
  if (l.includes('mercedes')) return 'Mercedes Benz';
  if (l.includes('volkswagen') || l.includes('wolks') || l.includes('vw')) return 'Volkswagen';
  if (l.includes('renault')) return 'Renault';
  if (l.includes('fiat')) return 'Fiat';
  if (l.includes('peugeot')) return 'Peugeot';
  if (l.includes('citroen')) return 'Citroën';
  if (l.includes('tvs')) return 'TVS';
  if (l.includes('appia')) return 'Appia';
  if (l.includes('--') || l === '') return 'Sin dato';
  return 'Otra';
}

function detectInfraccion(desc) {
  const d = (desc || '').toLowerCase();
  if (d.includes('casco')) return 'Sin casco';
  if (d.includes('licencia') || d.includes('registro') || d.includes('sin lic')) return 'Sin licencia/registro';
  if (d.includes('contramano')) return 'Contramano';
  if (d.includes('documentacion') || d.includes('doc.')) return 'Sin documentación';
  if (d.includes('patente') && !d.includes('sin patente trasera')) return 'Sin patente';
  if (d.includes('estacionamiento') || d.includes('est.') || (d.includes('estacionado') && !d.includes('escape'))) return 'Est. defectuoso';
  if (d.includes('escape')) return 'Escape antireglamentario';
  if (d.includes('menor')) return 'Menor de edad';
  if (d.includes('seguro')) return 'Sin seguro';
  if (d.includes('desmantelad')) return 'Vehículo desmantelado';
  return 'Otra';
}

function getMes(fecha) {
  if (!fecha) return 'Sin fecha';
  const p = fecha.split('/');
  if (p.length < 3) return 'Sin fecha';
  const y = parseInt(p[2]) < 100 ? 2000 + parseInt(p[2]) : parseInt(p[2]);
  if (isNaN(y) || y < 2020) return 'Sin fecha';
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const m = parseInt(p[1]) - 1;
  return (meses[m] || 'Mes?') + ' ' + y;
}

function getHora(s) {
  if (!s) return -1;
  const h = parseInt(s.split(':')[0]);
  return isNaN(h) ? -1 : h;
}

// ─── Estado global ─────────────────────────────────────────────
let TODOS = [];
let FILTRADOS = [];
let evolChart = null;

// ─── Carga desde Google Sheets ─────────────────────────────────
async function cargarDatos() {
  setStatus('loading', 'Cargando datos desde Google Sheets…');
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const texto = await res.text();
    const filas = parseCSV(texto);

    TODOS = filas.map(r => ({
      n:           r['N'] || '',
      fecha:       r['Fecha Registro'] || r['Fecha Hecho'] || '',
      hora:        r['Hora Hecho'] || r['Hora Registro'] || '',
      inspector:   normInspector(r['Inspector'] || r['Legajo Inspector'] || ''),
      tipo:        (r['Tipo Acta'] || '').toUpperCase().includes('SECU') ? 'SECUESTRO' : 'MULTA',
      acta:        r['N Acta'] || '',
      marca:       normMarca(r['Modelo'] || r['Marca'] || ''),
      dominio:     r['Dominio'] || '',
      desc:        r['Descripcion'] || '',
      mes:         getMes(r['Fecha Registro'] || r['Fecha Hecho'] || ''),
      horaNum:     getHora(r['Hora Hecho'] || r['Hora Registro'] || ''),
      infraccion:  detectInfraccion(r['Descripcion'] || ''),
    }));

    FILTRADOS = [...TODOS];
    popularFiltros();
    renderTodo();
    const ts = new Date().toLocaleString('es-AR', {dateStyle:'short', timeStyle:'short'});
    setStatus('ok', 'Datos actualizados · ' + ts + ' · ' + TODOS.length + ' registros');
    document.getElementById('footer-ts').textContent = 'Última carga: ' + ts;
  } catch(e) {
    setStatus('err', 'Error al cargar: ' + e.message);
    document.getElementById('contenido').innerHTML =
      '<div class="error-state">' +
      '<strong>No se pudieron cargar los datos.</strong><br><br>' +
      'Posibles causas:<br>' +
      '1. La planilla no está publicada en la web.<br>' +
      '2. La URL del CSV en el código no es la correcta.<br><br>' +
      'Pasos: Abrí la planilla → Archivo → Publicar en la web → elegí la hoja → formato CSV → Publicar → copiá la URL → reemplazá <code>CSV_URL</code> en este archivo.<br><br>' +
      'Error técnico: <code>' + e.message + '</code>' +
      '</div>';
  }
}

function setStatus(tipo, txt) {
  const dot = document.getElementById('status-dot');
  const t   = document.getElementById('status-txt');
  dot.className = 'status-dot' + (tipo === 'loading' ? ' loading' : tipo === 'err' ? ' err' : '');
  t.textContent = txt;
}

// ─── Filtros ───────────────────────────────────────────────────
const MESES_ORD = [
  'Diciembre 2025','Enero 2026','Febrero 2026','Marzo 2026','Abril 2026','Mayo 2026','Junio 2026'
];

function popularFiltros() {
  const inspSel = document.getElementById('fil-inspector');
  inspSel.innerHTML = '<option value="">Todos</option>';
  [...new Set(TODOS.map(r=>r.inspector))].sort()
    .forEach(i => { const o = document.createElement('option'); o.value=i; o.textContent=i; inspSel.appendChild(o); });

  const mesSel = document.getElementById('fil-mes');
  mesSel.innerHTML = '<option value="">Todos</option>';
  const mesesDisp = [...new Set(TODOS.map(r=>r.mes))];
  MESES_ORD.filter(m => mesesDisp.includes(m))
    .forEach(m => { const o = document.createElement('option'); o.value=m; o.textContent=m; mesSel.appendChild(o); });
}

function aplicarFiltros() {
  const insp = document.getElementById('fil-inspector').value;
  const tipo = document.getElementById('fil-tipo').value;
  const mes  = document.getElementById('fil-mes').value;
  FILTRADOS = TODOS.filter(r =>
    (!insp || r.inspector === insp) &&
    (!tipo || r.tipo === tipo) &&
    (!mes  || r.mes === mes)
  );
  renderTodo();
}

function resetFiltros() {
  document.getElementById('fil-inspector').value = '';
  document.getElementById('fil-tipo').value = '';
  document.getElementById('fil-mes').value = '';
  FILTRADOS = [...TODOS];
  renderTodo();
}

// ─── Render principal ──────────────────────────────────────────
function renderTodo() {
  document.getElementById('contenido').innerHTML = `
    <div class="seccion">
      <div class="sec-titulo">Resumen general</div>
      <div class="metric-grid" id="metrics"></div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Distribución</div>
      <div class="chart-grid">
        <div class="chart-card"><div class="chart-titulo">Actas por inspector</div><div class="bars" id="ch-inspector"></div></div>
        <div class="chart-card"><div class="chart-titulo">Infracciones más frecuentes</div><div class="bars" id="ch-infrac"></div></div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Evolución mensual</div>
      <div class="chart-card full">
        <div class="chart-titulo">Actas por mes</div>
        <div style="position:relative;width:100%;height:220px;">
          <canvas id="ch-evol" role="img" aria-label="Gráfico de barras agrupadas: multas y secuestros por mes"></canvas>
        </div>
        <div class="leyenda" id="leyenda-evol"></div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Distribución horaria — hora del hecho</div>
      <div class="chart-card full">
        <div class="heatmap-wrap">
          <div class="heatmap" id="ch-heatmap"></div>
          <div class="hm-hours" id="ch-horas"></div>
        </div>
        <div class="hm-legend">
          <span>0</span><div class="hm-grad"></div><span>máx</span>
        </div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Marcas más frecuentes</div>
      <div class="chart-card full"><div class="bars" id="ch-marcas"></div></div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Últimas 20 actas registradas</div>
      <div class="chart-card full" style="padding:.75rem;">
        <div class="tabla-wrap">
          <table>
            <thead><tr>
              <th>N° acta</th><th>Fecha</th><th>Inspector</th><th>Tipo</th>
              <th>Vehículo</th><th>Dominio</th><th>Infracción</th>
            </tr></thead>
            <tbody id="tabla-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById('fil-count').textContent = FILTRADOS.length + ' registros';
  renderMetrics();
  renderBars('ch-inspector', contarPor(FILTRADOS,'inspector'), '#0e5a9e');
  renderBars('ch-infrac',    contarPor(FILTRADOS,'infraccion'), '#b8863d');
  renderEvolucion();
  renderHeatmap();
  renderBars('ch-marcas', contarPor(FILTRADOS,'marca'), '#0a3a68');
  renderTabla();
}

// ─── Helpers ───────────────────────────────────────────────────
function contarPor(arr, campo) {
  const c = {};
  arr.forEach(r => { const k = r[campo] || 'Sin dato'; c[k] = (c[k]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}

function renderMetrics() {
  const d = FILTRADOS;
  const total   = d.length;
  const multas  = d.filter(r=>r.tipo==='MULTA').length;
  const seqs    = d.filter(r=>r.tipo==='SECUESTRO').length;
  const sinCasco= d.filter(r=>r.infraccion==='Sin casco').length;
  const menores = d.filter(r=>(r.desc||'').toLowerCase().includes('menor')).length;
  const sinDoc  = d.filter(r=>r.infraccion==='Sin documentación').length;
  const pctSec  = total ? Math.round((seqs/total)*100) : 0;

  document.getElementById('metrics').innerHTML = `
    <div class="metric-card azul"><div class="m-lbl">Total actas</div><div class="m-val">${total}</div><div class="m-sub">en el período</div></div>
    <div class="metric-card rojo"><div class="m-lbl">Secuestros</div><div class="m-val">${seqs}</div><div class="m-sub">${pctSec}% del total</div></div>
    <div class="metric-card ocre"><div class="m-lbl">Multas</div><div class="m-val">${multas}</div><div class="m-sub">${100-pctSec}% del total</div></div>
    <div class="metric-card verde"><div class="m-lbl">Sin casco</div><div class="m-val">${sinCasco}</div><div class="m-sub">infracción más frecuente</div></div>
    <div class="metric-card rojo"><div class="m-lbl">Menores de edad</div><div class="m-val">${menores}</div><div class="m-sub">involucrados en actas</div></div>
    <div class="metric-card amar"><div class="m-lbl">Sin documentación</div><div class="m-val">${sinDoc}</div><div class="m-sub">actas por doc. faltante</div></div>
  `;
}

function renderBars(id, data, color) {
  const max = data[0] ? data[0][1] : 1;
  const top = data.slice(0,9);
  document.getElementById(id).innerHTML = top.map(([lbl,val]) => `
    <div class="bar-row">
      <div class="bar-lbl" title="${lbl}">${lbl}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((val/max)*100)}%;background:${color};"></div></div>
      <div class="bar-num">${val}</div>
    </div>
  `).join('');
}

function renderEvolucion() {
  const mesesDisp = [...new Set(FILTRADOS.map(r=>r.mes))];
  const meses = MESES_ORD.filter(m => mesesDisp.includes(m));
  const labels  = meses.map(m => m.replace(' 2025','').replace(' 2026',''));
  const multas  = meses.map(m => FILTRADOS.filter(r=>r.mes===m&&r.tipo==='MULTA').length);
  const seqs    = meses.map(m => FILTRADOS.filter(r=>r.mes===m&&r.tipo==='SECUESTRO').length);

  if (evolChart) { evolChart.destroy(); evolChart = null; }

  document.getElementById('leyenda-evol').innerHTML = `
    <span class="ley-item"><span class="ley-sw" style="background:#0e5a9e;"></span>Multas</span>
    <span class="ley-item"><span class="ley-sw" style="background:#a8322c;"></span>Secuestros</span>
  `;

  evolChart = new Chart(document.getElementById('ch-evol'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label:'Multas',    data:multas, backgroundColor:'#0e5a9e', borderRadius:3, barPercentage:.55 },
        { label:'Secuestros',data:seqs,   backgroundColor:'#a8322c', borderRadius:3, barPercentage:.55 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{mode:'index',intersect:false} },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:11, family:'IBM Plex Mono'}, color:'#6b6760'} },
        y:{ beginAtZero:true, grid:{color:'rgba(0,0,0,0.05)'}, ticks:{font:{size:11, family:'IBM Plex Mono'}, color:'#6b6760', stepSize:5} }
      }
    }
  });
}

function renderHeatmap() {
  const conteo = {};
  for(let i=0;i<24;i++) conteo[i]=0;
  FILTRADOS.filter(r=>r.horaNum>=0).forEach(r => { conteo[r.horaNum]=(conteo[r.horaNum]||0)+1; });
  const maxC = Math.max(...Object.values(conteo), 1);

  const azules = ['#e8f0f8','#b5d4f4','#85b7eb','#378add','#185fa5','#0c447c','#0a3a68'];
  function getColor(v) {
    if (v===0) return azules[0];
    return azules[Math.min(6, Math.max(1, Math.ceil((v/maxC)*6)))];
  }
  function getTextColor(v) { return v > maxC*0.4 ? '#fff' : '#6b6760'; }

  const hm = document.getElementById('ch-heatmap');
  const hr = document.getElementById('ch-horas');
  let hmHtml='', hrHtml='';
  for(let h=0;h<24;h++){
    const v = conteo[h]||0;
    hmHtml += `<div class="hm-cell" style="background:${getColor(v)};color:${getTextColor(v)};" title="${h}:00 — ${v} actas">${v||''}</div>`;
    hrHtml += `<div class="hm-hr">${h}</div>`;
  }
  hm.innerHTML = hmHtml;
  hr.innerHTML = hrHtml;
}

function renderTabla() {
  const recientes = [...FILTRADOS].reverse().slice(0,20);
  document.getElementById('tabla-body').innerHTML = recientes.map(r => `
    <tr>
      <td style="font-family:var(--mono);font-size:11px;">${r.acta}</td>
      <td style="font-family:var(--mono);font-size:11px;white-space:nowrap;">${r.fecha}</td>
      <td>${r.inspector}</td>
      <td><span class="badge ${r.tipo==='MULTA'?'badge-multa':'badge-sec'}">${r.tipo}</span></td>
      <td>${r.marca}</td>
      <td style="font-family:var(--mono);font-size:11px;">${r.dominio}</td>
      <td style="font-size:11px;color:var(--neutro);">${(r.desc||'').slice(0,55)}${r.desc&&r.desc.length>55?'…':''}</td>
    </tr>
  `).join('');
}

// ─── Arranque ──────────────────────────────────────────────────
cargarDatos();
</script>
</body>
</html>
